name: Store submit

# Manual dispatch: upload an existing immutable release-candidate package to
# the existing Chrome Web Store item and submit it for review. Downloads the
# exact draft-release asset (never rebuilds), verifies digest and provenance
# attestation, then talks to the Store API v2 inside the protected
# `chrome-web-store` environment.
#
# Credentials, in preference order (see docs/RELEASES.md for the one-time
# setup that creates them — this workflow is prepared and static-checked but
# unproven against a live publisher account until that setup is performed):
#   1. Workload Identity Federation: vars CWS_WIF_PROVIDER (full resource
#      name of the OIDC provider) + CWS_SERVICE_ACCOUNT (email). Short-lived
#      tokens via GitHub OIDC -> Google STS -> service-account impersonation.
#   2. Fallback: secrets CWS_CLIENT_ID / CWS_CLIENT_SECRET /
#      CWS_REFRESH_TOKEN (classic refresh-token flow), stored only in the
#      protected environment.
# Non-secret identifiers: vars CWS_PUBLISHER_ID and CWS_ITEM_ID.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to submit (e.g. 1.0.0); its vX.Y.Z draft release must exist'
        required: true
      expected_sha256:
        description: 'Expected SHA-256 of the package ZIP (from the release notes)'
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository (for gh attestation verification context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the exact candidate asset from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" --pattern "trailer-lens-${{ inputs.version }}.zip" \
            --pattern "trailer-lens-${{ inputs.version }}.sha256" --dir package
          ls -l package

      - name: Verify digest against the dispatch input and the recorded checksum
        run: |
          COMPUTED=$(sha256sum "package/trailer-lens-${{ inputs.version }}.zip" | cut -d' ' -f1)
          RECORDED=$(cut -d' ' -f1 "package/trailer-lens-${{ inputs.version }}.sha256")
          echo "computed=$COMPUTED"
          test "$COMPUTED" = "${{ inputs.expected_sha256 }}"
          test "$COMPUTED" = "$RECORDED"

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "package/trailer-lens-${{ inputs.version }}.zip" --repo "$GITHUB_REPOSITORY"

      - name: Acquire a Chrome Web Store access token
        id: token
        env:
          CWS_WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CWS_WIF_PROVIDER" ] && [ -n "$CWS_SERVICE_ACCOUNT" ]; then
            echo "Using Workload Identity Federation"
            OIDC=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$CWS_WIF_PROVIDER" | jq -r .value)
            STS=$(curl -sSf https://sts.googleapis.com/v1/token \
              -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
              -d audience="//iam.googleapis.com/$CWS_WIF_PROVIDER" \
              -d scope=https://www.googleapis.com/auth/cloud-platform \
              -d requested_token_type=urn:ietf:params:oauth:token-type:access_token \
              -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
              -d subject_token="$OIDC" | jq -r .access_token)
            TOKEN=$(curl -sSf -H "Authorization: Bearer $STS" -H "Content-Type: application/json" \
              "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$CWS_SERVICE_ACCOUNT:generateAccessToken" \
              -d '{"scope":["https://www.googleapis.com/auth/chromewebstore"]}' | jq -r .accessToken)
          elif [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            echo "Using refresh-token fallback"
            TOKEN=$(curl -sSf https://oauth2.googleapis.com/token \
              -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
              -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          else
            echo "No Store credentials are configured in the chrome-web-store environment." >&2
            echo "Perform the one-time setup in docs/RELEASES.md first." >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload the package to the existing Store item
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@package/trailer-lens-${{ inputs.version }}.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}:upload" \
            | tee upload-response.json
          jq -e '.error == null' upload-response.json >/dev/null

      # STAGED_PUBLISH is the load-bearing field: without a body, publishType
      # defaults to DEFAULT_PUBLISH and the item would go live automatically
      # the moment review approves it — silently deleting the human
      # publication gate this lane promises. blockOnWarnings keeps review
      # warnings visible as failures instead of waving them through.
      # The response body is captured and printed on BOTH outcomes: with
      # blockOnWarnings, warning details arrive in the error response, and
      # swallowing them (curl -f discards the body) would wave the review
      # feedback through silently. On success, warningInfo entries are
      # surfaced individually.
      - name: Submit for review as a staged publish (publication remains a separate human gate)
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o publish-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType": "STAGED_PUBLISH", "blockOnWarnings": true}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}:publish")
          echo "HTTP $HTTP"
          cat publish-response.json
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Submission was rejected (HTTP $HTTP) — the response above carries the reason/warnings." >&2
            exit 1
          fi
          jq -e '.error == null' publish-response.json >/dev/null
          jq -r '(.warningInfo // [])[] | "::warning::Store submission warning: \(. | tostring)"' publish-response.json

      - name: Validate the submitted revision state
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}:fetchStatus" \
            | tee status-response.json
          STATE=$(jq -r '.submittedItemRevisionStatus.state // empty' status-response.json)
          if [ -z "$STATE" ]; then
            echo "::error::fetchStatus shows no submitted revision — the submission did not take." >&2
            exit 1
          fi
          echo "Submitted revision state: $STATE (for the dispatch's version ${{ inputs.version }})"

      - name: State the honest boundary
        run: |
          echo "Upload and submission requests were accepted and the pending revision"
          echo "state was validated above. Review is asynchronous: an accepted"
          echo "submission is NOT approval; an approved STAGED_PUBLISH submission is"
          echo "staged, NOT published. Publication is an explicit owner action in the"
          echo "Developer Dashboard; store-status.yml records the truthful state"
          echo "around that decision."
