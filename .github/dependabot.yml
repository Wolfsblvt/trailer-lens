# Dependency update cadence a single maintainer can actually review:
# grouped monthly PRs instead of permanent wallpaper. Security alerts are
# enabled at the repository level and arrive independently of this cadence.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tooling:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2
